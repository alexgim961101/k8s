---
# 노드 사전 준비 — kubeadm이 요구하는 조건을 Ansible로 맞춘다.
#
# 이 플레이북들이 수행하는 설정은 scripts/00-common.sh 안에도 들어 있다.
# 여기서는 그중 "노드 상태"에 해당하는 부분(커널·swap·패키지·컨테이너 런타임 확인)을
# 선언적으로 미리 적용하고, 문제가 있으면 스크립트가 다시 덮어쓴다.
#
#   ansible-playbook -i inventory/hosts.ini playbooks/01-prepare-nodes.yml
#
# 04단계 W11의 kubeadm 실습은 이 플레이북부터 시작한다.

- name: 노드 사전 준비
  hosts: k8s_nodes
  become: true
  gather_facts: true

  tasks:
    - name: 지원 아키텍처인지 확인
      ansible.builtin.assert:
        that:
          - ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: "지원하지 않는 아키텍처: {{ ansible_architecture }}"

    - name: Ubuntu 24.04 이상인지 확인 (cgroup v2)
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version is version('24.04', '>=')
        fail_msg: "Ubuntu 24.04 이상을 기준으로 작성되었다 (현재 {{ ansible_distribution }} {{ ansible_distribution_version }})"

    - name: 각 노드에 고유 hostname 이 있는지 확인
      ansible.builtin.assert:
        that:
          - ansible_hostname | length > 0
        fail_msg: "hostname 이 비어 있다"

    - name: 필수 패키지 설치
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
          - conntrack
          - socat
          - ebtables
          - ethtool
          - ipset
          - iptables
          - jq
          - netcat-openbsd
          - nfs-common
          - open-iscsi
        state: present
        update_cache: true

    # br_netfilter 를 로드하면 bridge 트래픽이 iptables 를 거치게 된다.
    # 이게 없으면 Service ClusterIP 통신이 조용히 깨진다.
    - name: 커널 모듈 등록
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"
      notify: reload sysctl

    # ansible-core 만으로 되도록 community.general 같은 컬렉션을 쓰지 않는다.
    # modprobe 는 여러 번 실행해도 안전하다.
    - name: 커널 모듈 즉시 로드
      ansible.builtin.command: modprobe {{ item }}
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: sysctl 설정 (ip_forward, bridge-nf-call-iptables)
      ansible.builtin.copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
        mode: "0644"
      notify: reload sysctl

    - name: sysctl 즉시 적용
      ansible.builtin.command: sysctl --system
      changed_when: false

    # kubelet 은 swap 이 켜져 있으면 시작을 거부한다.
    - name: swap 비활성화 (즉시)
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: fstab 의 swap 항목 주석 처리 (재부팅 후에도 유지)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^([^#].*[[:space:]]swap[[:space:]].*)$'
        line: '# \1'
        backrefs: true
        state: present

    - name: swap.target 마스킹
      ansible.builtin.systemd:
        name: swap.target
        masked: true

    - name: 사전 준비 결과 확인
      ansible.builtin.shell: |
        set -e
        echo "hostname      : $(hostname)"
        echo "arch          : $(uname -m)"
        echo "kernel        : $(uname -r)"
        echo "ip_forward    : $(sysctl -n net.ipv4.ip_forward)"
        echo "bridge-nf     : $(sysctl -n net.bridge.bridge-nf-call-iptables)"
        echo "swap entries  : $(swapon --show --noheadings | wc -l)"
      args:
        executable: /bin/bash
      changed_when: false
      register: prep_check

    - name: 결과 출력
      ansible.builtin.debug:
        msg: "{{ prep_check.stdout_lines }}"

  handlers:
    - name: reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: false
