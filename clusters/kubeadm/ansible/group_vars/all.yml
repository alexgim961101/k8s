---
# 모든 노드에 공통으로 적용되는 변수

# 노드 공통 설치 스크립트 위치 (ansible 디렉터리 기준 상대 경로)
k8s_scripts_dir: "{{ playbook_dir }}/../scripts"
k8s_common_script: "{{ k8s_scripts_dir }}/00-common.sh"
k8s_cp_script: "{{ k8s_scripts_dir }}/01-control-plane.sh"
k8s_worker_script: "{{ k8s_scripts_dir }}/02-worker.sh"

# 스크립트를 노드의 임시 경로로 보낸 뒤 실행한다
k8s_remote_script_dir: /tmp/k8s-setup

# --- 컨트롤 플레인 ---
k8s_cluster_name: k8s-study
k8s_pod_cidr: 10.244.0.0/16      # Calico 기본값(192.168.0.0/16)은 Multipass/UTM 대역과 겹친다

# 비우면 스크립트가 이 노드의 IP를 자동 감지한다.
# HA로 확장할 계획이면 처음부터 로드밸런서 주소를 넣는다 (인증서 SAN에 박힌다).
k8s_control_plane_endpoint: ""
k8s_apiserver_advertise_address: ""

# CNI(Calico)를 스크립트가 설치하게 할지 여부. false 면 --skip-cni 로 실행된다.
k8s_install_cni: true

# join 토큰 유효기간. 노드를 며칠에 걸쳐 추가한다면 늘린다.
k8s_join_token_ttl: 24h

# 이미 설치된 노드에서 강제로 다시 실행할 때 true 로 바꾼다
k8s_force_reinstall: false
